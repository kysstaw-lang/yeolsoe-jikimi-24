<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
@@HEAD@@
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #eef1f7;
    --card: #ffffff;
    --card-2: #f4f5fb;
    --ink: #14171f;
    --muted: #8a8fa3;
    --muted-2: #c3c7d6;
    --accent: #4f63f0;
    --accent-hover: #3c4fdb;
    --accent-soft: #e8ebfd;
    --border: #e8eaf2;
    --shadow: rgba(31, 41, 82, 0.14);
    --font: "Gothic A1", "Apple SD Gothic Neo", sans-serif;
  }
  html[lang="en"] { --font: "Plus Jakarta Sans", "Gothic A1", "Apple SD Gothic Neo", sans-serif; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: anywhere; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  h1, h2, p { margin: 0; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 56px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
  .brand svg { width: 19px; height: 19px; color: var(--accent); }
  .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1.5px solid var(--border); color: var(--ink);
    border-radius: 999px; padding: 7px 14px 7px 10px;
    font-size: 0.82rem; font-weight: 700; white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .back svg { width: 15px; height: 15px; }
  .back:hover { border-color: var(--accent); color: var(--accent); }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .lang-switch { display: inline-flex; gap: 2px; background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .lang-switch a { padding: 5px 12px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; color: var(--muted); }
  .lang-switch a:hover { color: var(--accent); }
  .lang-switch a[aria-current="true"] { background: var(--ink); color: #fff; }
  .lang-switch a, .call, .back { white-space: nowrap; }
  @media (max-width: 560px) { .brand { display: none; } .top { gap: 8px; } .top-right { gap: 8px; } .call { padding: 8px 12px; } }
  .call { background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 16px; font-size: 0.82rem; font-weight: 700; }
  .call:hover { background: var(--accent); }

  .crumbs { margin-top: 26px; font-size: 0.78rem; color: var(--muted); }
  .crumbs a:hover { color: var(--accent); }

  .card { margin-top: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 26px; box-shadow: 0 40px 80px -28px var(--shadow); padding: 34px 32px 32px; }
  @media (max-width: 560px) { .card { padding: 26px 20px; border-radius: 20px; } }

  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 { margin-top: 12px; font-size: clamp(1.6rem, 4.2vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; text-wrap: balance; }
  .headline { margin-top: 12px; font-weight: 700; color: var(--accent); font-size: 0.98rem; }
  .intro { margin-top: 16px; border-left: 2px solid var(--accent); padding-left: 14px; color: #5b6075; font-size: 0.96rem; line-height: 1.85; }

  h2 { margin-top: 34px; font-size: 1.08rem; font-weight: 800; }
  .services { margin-top: 12px; list-style: none; padding: 0; }
  .services li { padding: 14px 0; border-top: 1px solid var(--border); }
  .services li:last-child { border-bottom: 1px solid var(--border); }
  .services b { display: block; font-size: 0.96rem; }
  .services span { display: block; margin-top: 3px; font-size: 0.88rem; color: var(--muted); }

  .body p { margin-top: 12px; font-size: 0.94rem; color: #5b6075; line-height: 1.85; }
  .dong-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .dong-chips span { border: 1px solid var(--border); border-radius: 9px; padding: 6px 11px; font-size: 0.8rem; color: #5b6075; background: var(--card-2); }

  .neighbors { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .neighbors a, .neighbors span { border-radius: 999px; padding: 7px 14px; font-size: 0.82rem; font-weight: 600; }
  .neighbors a { background: var(--accent-soft); color: var(--accent); }
  .neighbors a:hover { background: var(--accent); color: #fff; }
  .neighbors span { background: var(--card-2); color: var(--muted); }

  .cta { margin-top: 36px; background: var(--accent-soft); border-radius: 20px; padding: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .cta p { font-weight: 800; font-size: 1.02rem; }
  .cta small { display: block; margin-top: 2px; font-size: 0.82rem; font-weight: 500; color: #5b6075; }
  .cta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 560px) { .cta-actions { width: 100%; } .cta-actions .btn { flex: 1; } }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
    min-width: 120px; border: 1.5px solid transparent; border-radius: 12px;
    padding: 12px 20px; font-size: 0.9rem; font-weight: 700; line-height: 1.2;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  @@FOOTER_CSS@@

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-left">
      <a class="back" id="backBtn" href="@@HOME_URL@@" aria-label="{{backAria}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        {{back}}
      </a>
      <a class="brand" href="@@HOME_URL@@">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        {{brand}}
      </a>
    </div>
    <div class="top-right">@@LANG_SWITCH@@<a class="call" href="tel:@@PHONE_TEL@@">{{callBtn}}</a></div>
  </header>

  <nav class="crumbs">{{crumbs}}</nav>

  <main class="card">
    <div class="eyebrow">{{areaEyebrow}}</div>
    <h1>{{areaH1}}</h1>
    <p class="headline">@@HEADLINE@@</p>
    <p class="intro">@@INTRO@@</p>

    <h2>{{h2Services}}</h2>
    <ul class="services">
@@SERVICES@@
    </ul>

    @@BODY@@

    <h2>{{h2Dongs}}</h2>
    <div class="dong-chips">@@DONG_CHIPS@@</div>

    <h2>{{h2Neighbors}}</h2>
    <div class="neighbors">@@NEIGHBORS@@</div>

    <section class="cta" aria-label="{{ctaInquiry}}">
      <div>
        <p>{{ctaTitle}}<small>@@HOURS@@</small></p>
      </div>
      <div class="cta-actions">
        <a class="btn btn-primary" href="tel:@@PHONE_TEL@@">{{ctaCall}}</a>
        <a class="btn btn-ghost" href="@@HOME_URL@@#inquiry">{{ctaInquiry}}</a>
      </div>
    </section>
  </main>

  @@FOOTER@@
</div>
<script>
  (function () {
    var back = document.getElementById('backBtn');
    back.addEventListener('click', function (e) {
      var ref = document.referrer;
      if (ref && ref.indexOf(location.origin) === 0 && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });
  })();
</script>
</body>
</html>
