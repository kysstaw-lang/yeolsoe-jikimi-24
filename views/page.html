<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
@@HEAD@@
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="@@FONT_URL@@">
<style>
  :root {
    --bg: #eef1f7;
    --card: #ffffff;
    --card-2: #f4f5fb;
    --ink: #14171f;
    --muted: #8a8fa3;
    --muted-2: #c3c7d6;
    --accent: #4f63f0;
    --accent-hover: #3c4fdb;
    --accent-soft: #e8ebfd;
    --border: #e8eaf2;
    --shadow: rgba(31, 41, 82, 0.14);
    --font: "Gothic A1", "Apple SD Gothic Neo", sans-serif;
  }
  html[lang="en"] { --font: "Plus Jakarta Sans", "Gothic A1", "Apple SD Gothic Neo", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: anywhere; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  h1, h2, p { margin: 0; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 20px 56px; }
  .back-row { margin-bottom: 4px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1.5px solid var(--border); color: var(--ink);
    border-radius: 999px; padding: 7px 14px 7px 10px;
    font-size: 0.82rem; font-weight: 700; white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .back svg { width: 15px; height: 15px; }
  .back:hover { border-color: var(--accent); color: var(--accent); }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
  .brand svg { width: 19px; height: 19px; color: var(--accent); }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .lang-switch { display: inline-flex; gap: 2px; background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .lang-switch a { padding: 5px 12px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; color: var(--muted); }
  .lang-switch a:hover { color: var(--accent); }
  .lang-switch a[aria-current="true"] { background: var(--ink); color: #fff; }
  .lang-switch a, .call, .back { white-space: nowrap; }
  @media (max-width: 560px) { .brand { display: none; } .top { gap: 8px; } .top-right { gap: 8px; } .call { padding: 8px 12px; } }
  .call { background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 16px; font-size: 0.82rem; font-weight: 700; }
  .call:hover { background: var(--accent); }

  .head { text-align: center; margin-top: 34px; }
  .head h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
  .head p { margin-top: 10px; color: var(--muted); font-size: 1rem; }

  .tab-nav { display: inline-flex; gap: 4px; background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-top: 22px; }
  .tab-nav a { display: inline-flex; align-items: center; gap: 7px; padding: 9px 20px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; color: var(--muted); }
  .tab-nav a:hover { color: var(--accent); }
  @media (max-width: 420px) { .tab-nav { max-width: 100%; } .tab-nav a { padding: 9px 13px; gap: 5px; } }
  .tab-nav a.on { background: var(--ink); color: #fff; }
  .tab-nav .cnt { font-size: 0.74rem; font-weight: 700; opacity: 0.75; font-variant-numeric: tabular-nums; }

  /* ---- review list ---- */
  .rv-grid { margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .rv-card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 50px -34px var(--shadow); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .rv-card:hover { transform: translateY(-3px); box-shadow: 0 28px 56px -30px var(--shadow); }
  .rv-thumb { position: relative; aspect-ratio: 4 / 3; background: var(--card-2); }
  .rv-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rv-thumb .pc { position: absolute; right: 10px; bottom: 10px; background: rgba(20, 23, 31, 0.72); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .rv-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .rv-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .rv-tag { font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .rv-tag.gray { background: var(--card-2); color: var(--muted); }
  .rv-card h2 { font-size: 1.04rem; font-weight: 800; line-height: 1.4; }
  .rv-excerpt { font-size: 0.86rem; color: #5b6075; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rv-date { margin-top: auto; font-size: 0.76rem; color: var(--muted); }
  .pd-price { margin-top: auto; font-size: 0.92rem; font-weight: 800; color: var(--ink); }
  .pd-price.big { margin-top: 10px; font-size: 1.15rem; }
  .rv-empty { margin-top: 32px; background: var(--card); border: 1px dashed var(--border); border-radius: 20px; padding: 60px 20px; text-align: center; color: var(--muted); }

  /* ---- review detail ---- */
  .card { margin-top: 26px; background: var(--card); border: 1px solid var(--border); border-radius: 26px; box-shadow: 0 40px 80px -28px var(--shadow); padding: 34px 32px 32px; max-width: 820px; margin-left: auto; margin-right: auto; }
  @media (max-width: 560px) { .card { padding: 24px 18px; border-radius: 20px; } }
  .card h1 { margin-top: 12px; font-size: clamp(1.5rem, 3.6vw, 2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.35; text-wrap: balance; }
  .card .meta { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }
  .card .text p { margin-top: 14px; font-size: 0.98rem; color: #454a5e; line-height: 1.9; }
  .gallery { margin-top: 22px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .gallery button { padding: 0; border: none; background: var(--card-2); border-radius: 14px; overflow: hidden; cursor: zoom-in; aspect-ratio: 4 / 3; }
  .gallery button:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 10; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* product photos are square (1:1) */
  .rv-thumb.sq { aspect-ratio: 1 / 1; }
  .gallery.sq button, .gallery.sq button:first-child { aspect-ratio: 1 / 1; }
  .gallery.sq button:first-child { width: min(100%, 560px); justify-self: center; }
  .back-list { display: inline-block; margin-top: 26px; font-weight: 700; font-size: 0.9rem; color: var(--accent); }
  .back-list:hover { text-decoration: underline; }

  .lb { position: fixed; inset: 0; background: rgba(10, 12, 20, 0.86); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  .lb.open { display: flex; }
  .lb img { max-width: 100%; max-height: 100%; border-radius: 10px; }
  .lb button { position: absolute; top: 16px; right: 16px; background: rgba(255, 255, 255, 0.16); color: #fff; border: none; border-radius: 999px; padding: 9px 16px; font-family: inherit; font-weight: 700; cursor: pointer; }

  .cta { margin-top: 34px; background: var(--accent-soft); border-radius: 20px; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .cta p { font-weight: 800; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-width: 120px; border: 1.5px solid transparent; border-radius: 12px; padding: 12px 20px; font-size: 0.9rem; font-weight: 700; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  /* ---- faq / checklist ---- */
  .faq { max-width: 820px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 10px; }
  .faq-item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 0 20px; box-shadow: 0 24px 50px -40px var(--shadow); }
  .faq-item summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 0; font-weight: 800; font-size: 1rem; line-height: 1.5; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after { content: "+"; flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 800; }
  .faq-item[open] summary::after { content: "−"; }
  .faq-a { padding: 0 0 18px; color: #454a5e; font-size: 0.95rem; line-height: 1.85; }
  .faq-a p + p { margin-top: 10px; }
  .guide { list-style: none; margin: 28px auto 0; padding: 0; max-width: 820px; display: grid; gap: 12px; }
  .guide li { display: flex; gap: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px 22px; box-shadow: 0 24px 50px -40px var(--shadow); }
  .g-n { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; }
  .guide h2 { font-size: 1.02rem; font-weight: 800; line-height: 1.45; }
  .guide p { margin-top: 6px; color: #454a5e; font-size: 0.93rem; line-height: 1.8; }
  .page-cta { max-width: 820px; margin: 0 auto; }
  .cta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-ghost { background: #fff; color: var(--ink); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  @@FOOTER_CSS@@

</style>
</head>
<body>
@@GNB@@
<div class="wrap">
  <div class="back-row">
    <a class="back" id="backBtn" href="@@BACK_URL@@" aria-label="{{backAria}}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      {{back}}
    </a>
  </div>

@@CONTENT@@

  @@FOOTER@@
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="{{lbClose}}"><img alt=""><button type="button" id="lbClose">{{lbClose}}</button></div>

<script>
  (function () {
    var back = document.getElementById('backBtn');
    back.addEventListener('click', function (e) {
      var ref = document.referrer;
      if (ref && ref.indexOf(location.origin) === 0 && history.length > 1) { e.preventDefault(); history.back(); }
    });

    var lb = document.getElementById('lb');
    var lbImg = lb.querySelector('img');
    function closeLb() { lb.classList.remove('open'); lbImg.removeAttribute('src'); }
    Array.prototype.forEach.call(document.querySelectorAll('.gallery button'), function (b) {
      b.addEventListener('click', function () { lbImg.src = b.getAttribute('data-full'); lb.classList.add('open'); });
    });
    lb.addEventListener('click', function (e) { if (e.target === lb || e.target.id === 'lbClose') closeLb(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
  })();
</script>
</body>
</html>
